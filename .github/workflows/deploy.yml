name: Deploy to Production

on:
  push:
    branches:
      - feature/map-guidance
      # - main  # Descomenta esto cuando merges a main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          # Nota: Asegúrate de configurar la ruta correcta de tu proyecto en el servidor
          script: |
            cd /var/www/dino
            
            # Descargar últimos cambios
            git pull origin feature/map-guidance
            
            # Instalar dependencias si es necesario
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            
            # Limpiar cachés de Laravel
            php artisan cache:clear
            php artisan view:clear
            php artisan config:clear
            php artisan route:clear
            
            # Compilar assets del frontend
            npm install
            npm run build
            
            # Reiniciar WebSockets (Reverb) y colas
            php artisan reverb:restart
            php artisan queue:restart
