<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C4B5FD;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fondo redondeado -->
  <rect x="0" y="0" width="320" height="100" rx="16" ry="16" fill="url(#bgGrad)" />

  <!-- Icono: bolsa de compras estilizada -->
  <g transform="translate(14, 12)">
    <!-- Asa izquierda -->
    <path d="M22 20 Q18 10 28 8 Q38 6 36 20" fill="none" stroke="url(#iconGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Cuerpo bolsa -->
    <rect x="14" y="20" width="44" height="36" rx="7" ry="7" fill="url(#iconGrad)" opacity="0.95"/>
    <!-- Detalle líneas bolsa -->
    <line x1="36" y1="20" x2="36" y2="56" stroke="white" stroke-width="1.5" opacity="0.3"/>
    <!-- Estrella/precio dentro -->
    <circle cx="36" cy="38" r="8" fill="white" opacity="0.25"/>
    <text x="36" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">$</text>
  </g>

  <!-- Texto "bari" -->
  <text x="86" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="800" fill="white" letter-spacing="-1">bari</text>

  <!-- Texto "tienda" en color más claro -->
  <text x="162" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="300" fill="#C4B5FD" letter-spacing="-1">tienda</text>

  <!-- Línea decorativa pequeña debajo -->
  <rect x="86" y="66" width="220" height="3" rx="2" fill="#A78BFA" opacity="0.5"/>

  <!-- Tagline -->
  <text x="86" y="82" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#DDD6FE" letter-spacing="2" opacity="0.85">TU TIENDA ONLINE</text>
</svg>
