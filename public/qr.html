<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Código QR - Baritienda</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: system-ui, -apple-system, sans-serif;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            max-width: 500px;
            text-align: center;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 1.8rem;
            color: #222;
        }

        p {
            margin: 0 0 20px;
            color: #666;
            line-height: 1.5;
        }

        .qr-box {
            margin: 30px 0;
            padding: 20px;
            background: #fafafa;
            border-radius: 8px;
            border: 2px dashed #ddd;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        a, button {
            padding: 10px 16px;
            border: 0;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            transition: opacity .2s;
        }

        a:hover, button:hover {
            opacity: 0.85;
        }

        .btn-primary {
            background: #4dabf7;
            color: white;
        }

        .btn-secondary {
            background: #e9ecef;
            color: #333;
        }

        .info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 0.9rem;
            color: #888;
        }

        .url {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 6px;
            word-break: break-all;
            font-family: monospace;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Código QR Baritienda</h1>
        <p>Escanea este código desde tu celular para acceder a baritienda.online</p>

        <div class="qr-box">
            <img src="/qr-baritienda.png" alt="QR Code para Baritienda">
        </div>

        <div class="actions">
            <a href="/qr-baritienda.png" download="qr-baritienda.png" class="btn-primary">⬇️ Descargar imagen</a>
            <button class="btn-secondary" onclick="printQR()">🖨️ Imprimir</button>
        </div>

        <div class="info">
            <p><strong>URLs que apunta:</strong></p>
            <div class="url">https://baritienda.online</div>
            <p>Este código QR es permanente y funcionará para siempre.</p>
        </div>
    </div>

    <script>
        function printQR() {
            const img = document.querySelector('img');
            const printWindow = window.open('', '', 'height=600,width=600');
            printWindow.document.write('<html><head><title>QR Baritienda</title></head><body>');
            printWindow.document.write('<img src="' + img.src + '" style="width:100%; height:auto;">');
            printWindow.document.write('</body></html>');
            printWindow.document.close();
            setTimeout(() => printWindow.print(), 250);
        }
    </script>
</body>
</html>
